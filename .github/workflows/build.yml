name: Build FlameKatana

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: FlameKatana-jar
          path: target/FlameKatana-*.jar
